<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에세이 — 정지성</title>
<meta name="description" content="만들며 생각한 것들 — 자유 기고">
<style>
/* ============================================================
   Design Tokens — seed-design.io 에서 실측 추출한 값 기반
   (라이트 모드 값은 실측, 다크 모드 값은 팔레트 기반 근사)
   ============================================================ */
:root {
  /* Color — Role based (실측값) */
  --seed-color-bg-brand-solid: #f60;
  --seed-color-bg-brand-solid-pressed: #e14d00;
  --seed-color-bg-brand-weak: #fff2ec;
  --seed-color-bg-brand-weak-pressed: #ffe8db;
  --seed-color-bg-layer-default: #fff;
  --seed-color-bg-layer-fill: #f7f8f9;
  --seed-color-bg-layer-basement: #f3f4f5;
  --seed-color-bg-neutral-inverted: #2a3038;
  --seed-color-fg-neutral: #1a1c20;
  --seed-color-fg-neutral-muted: #555d6d;
  --seed-color-fg-neutral-subtle: #868b94;
  --seed-color-fg-neutral-inverted: #fff;
  --seed-color-fg-brand: #f60;
  --seed-color-fg-brand-contrast: #e14d00;
  --seed-color-stroke-neutral-weak: #dcdee3;
  --seed-color-stroke-neutral-muted: #00000010;
  --seed-color-stroke-focus-ring: #5e98fe;
  --seed-color-palette-carrot-300: #ffd5c0;

  /* Typography — clamp 유동형 스케일 (SEED 공식 그대로) */
  --fs-min: .8; --fs-mul: 1; --fs-max: 1.5;
  --seed-font-size-t2:  clamp(calc(12px * var(--fs-min)), calc(.75rem   * var(--fs-mul)), calc(12px * var(--fs-max)));
  --seed-font-size-t3:  clamp(calc(13px * var(--fs-min)), calc(.8125rem * var(--fs-mul)), calc(13px * var(--fs-max)));
  --seed-font-size-t5:  clamp(calc(16px * var(--fs-min)), calc(1rem     * var(--fs-mul)), calc(16px * var(--fs-max)));
  --seed-font-size-t6:  clamp(calc(18px * var(--fs-min)), calc(1.125rem * var(--fs-mul)), calc(18px * var(--fs-max)));
  --seed-font-size-t8:  clamp(calc(22px * var(--fs-min)), calc(1.375rem * var(--fs-mul)), calc(22px * var(--fs-max)));
  --seed-font-size-t10: clamp(calc(26px * var(--fs-min)), calc(1.625rem * var(--fs-mul)), calc(26px * var(--fs-max)));
  --seed-font-size-t13: clamp(calc(40px * var(--fs-min)), calc(2.5rem   * var(--fs-mul)), calc(40px * var(--fs-max)));
  --seed-font-size-t14: clamp(calc(48px * var(--fs-min)), calc(3rem     * var(--fs-mul)), calc(48px * var(--fs-max)));
  --seed-font-weight-regular: 400;
  --seed-font-weight-medium: 500;
  --seed-font-weight-bold: 700;

  /* Spacing — dimension 스케일 (실측값) */
  --seed-x1: 4px; --seed-x2: 8px; --seed-x3: 12px; --seed-x4: 16px;
  --seed-x5: 20px; --seed-x6: 24px; --seed-x8: 32px; --seed-x10: 40px;
  --seed-x14: 56px; --seed-x16: 64px;
  --seed-spacing-global-gutter: 16px;

  /* Radius (실측값) */
  --seed-radius-r2: 8px; --seed-radius-r3: 12px; --seed-radius-r4: 16px;
  --seed-radius-r6: 24px; --seed-radius-full: 9999px;

  /* Elevation (실측값) */
  --seed-shadow-s1: 0px 1px 4px 0px #00000014;
  --seed-shadow-s2: 0px 2px 10px 0px #0000001a;
  --seed-shadow-s3: 0px 4px 16px 0px #0000001f;

  /* Motion (실측값) */
  --seed-duration-d3: .15s;
  --seed-duration-d6: .3s;
  --seed-scale-pressed: .97;
}

/* 다크 모드 — SEED 다크 토큰은 미실측이므로 neutral/palette 실측값 기반 근사 */
[data-theme="dark"] {
  --seed-color-bg-layer-default: #1a1c20;
  --seed-color-bg-layer-fill: #212429;
  --seed-color-bg-layer-basement: #17191c;
  --seed-color-bg-brand-weak: #3a2115;
  --seed-color-bg-brand-weak-pressed: #47270f;
  --seed-color-fg-neutral: #f3f4f5;
  --seed-color-fg-neutral-muted: #b0b3ba;
  --seed-color-fg-neutral-subtle: #868b94;
  --seed-color-stroke-neutral-weak: #33373e;
  --seed-color-stroke-neutral-muted: #ffffff14;
  --seed-color-fg-brand: #ff9364;
  --seed-shadow-s1: 0px 1px 4px 0px #00000040;
  --seed-shadow-s2: 0px 2px 10px 0px #00000052;
  --seed-shadow-s3: 0px 4px 16px 0px #00000066;
}

/* ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
  background: var(--seed-color-bg-layer-default);
  color: var(--seed-color-fg-neutral);
  font-size: var(--seed-font-size-t5);
  line-height: 1.6;
  transition: background var(--seed-duration-d6), color var(--seed-duration-d6);
}
::selection { background: var(--seed-color-palette-carrot-300); color: #1a1c20; }
a { color: inherit; text-decoration: none; }
:focus-visible {
  outline: 2px solid var(--seed-color-stroke-focus-ring);
  outline-offset: 2px; border-radius: var(--seed-radius-r2);
}

.container {
  max-width: 960px; margin: 0 auto;
  padding: 0 var(--seed-spacing-global-gutter);
}

/* ---- Top Navigation (SEED Top Navigation 패턴 참조) ---- */
header {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--seed-color-bg-layer-default) 82%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--seed-color-stroke-neutral-muted);
}
.nav {
  display: flex; align-items: center; justify-content: space-between;
  height: var(--seed-x14);
}
.nav .logo {
  font-weight: var(--seed-font-weight-bold);
  font-size: var(--seed-font-size-t6);
  display: flex; align-items: center; gap: var(--seed-x2);
}
.logo-dot {
  width: 10px; height: 10px; border-radius: var(--seed-radius-full);
  background: var(--seed-color-bg-brand-solid); display: inline-block;
}
.nav ul { display: flex; gap: var(--seed-x6); list-style: none; align-items: center; }
.nav ul a {
  font-size: var(--seed-font-size-t3);
  color: var(--seed-color-fg-neutral-muted);
  font-weight: var(--seed-font-weight-medium);
  transition: color var(--seed-duration-d3);
}
.nav ul a:hover { color: var(--seed-color-fg-neutral); }
.theme-toggle {
  border: 1px solid var(--seed-color-stroke-neutral-weak);
  background: var(--seed-color-bg-layer-default);
  color: var(--seed-color-fg-neutral);
  width: 36px; height: 36px; border-radius: var(--seed-radius-full);
  cursor: pointer; font-size: 15px; line-height: 1;
  transition: transform var(--seed-duration-d3), background var(--seed-duration-d3);
}
.theme-toggle:active { transform: scale(var(--seed-scale-pressed)); }

/* ---- Hero ---- */
.hero { padding: calc(var(--seed-x16) * 1.6) 0 var(--seed-x16); }
.hero-grid {
  display: grid; grid-template-columns: minmax(0,1fr) 340px;
  gap: var(--seed-x10); align-items: center;
}
@media (max-width: 900px){ .hero-grid { grid-template-columns: 1fr; } .hero-anim { max-width: 280px; } }
/* Lottie 패널 — SEED 랜딩의 포스터 배경 + SVG 렌더 방식 재현 */
.hero-anim {
  aspect-ratio: 1/1; width: 100%;
  background: var(--seed-color-bg-brand-weak);
  border-radius: var(--seed-radius-r6);
  overflow: hidden; line-height: 0;
}
/* 플로팅 애니메이션 컨트롤 — SEED의 '동영상 재생/일시정지' 버튼 재현 */
.motion-toggle {
  position: fixed; right: var(--seed-x5); bottom: var(--seed-x5); z-index: 200;
  width: 44px; height: 44px; border-radius: var(--seed-radius-full);
  border: 1px solid var(--seed-color-stroke-neutral-weak);
  background: var(--seed-color-bg-layer-default);
  color: var(--seed-color-fg-neutral);
  box-shadow: var(--seed-shadow-s2);
  cursor: pointer; font-size: 14px; line-height: 1;
  transition: transform var(--seed-duration-d3), box-shadow var(--seed-duration-d3);
}
.motion-toggle:hover { box-shadow: var(--seed-shadow-s3); }
.motion-toggle:active { transform: scale(var(--seed-scale-pressed)); }

/* ---- 스크롤 등장 효과 — SEED의 .5s / translateY(1rem) 실측값 재현 ---- */
.reveal {
  opacity: 0; transform: translateY(1rem);
  transition: opacity .5s ease, transform .5s ease;
  transition-delay: var(--reveal-delay, 0s);
}
.reveal.in { opacity: 1; transform: translateY(0); }
/* 첫 페인트 전에는 트랜지션 없이 즉시 숨김 — 로드 시 역방향 페이드(깜빡임) 방지 */
body:not(.motion-ready) .reveal { transition: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}
.hero .eyebrow {
  display: inline-flex; align-items: center; gap: var(--seed-x2);
  font-size: var(--seed-font-size-t3);
  color: var(--seed-color-fg-brand-contrast);
  background: var(--seed-color-bg-brand-weak);
  padding: var(--seed-x1) var(--seed-x3);
  border-radius: var(--seed-radius-full);
  font-weight: var(--seed-font-weight-medium);
  margin-bottom: var(--seed-x5);
}
.hero h1 {
  font-size: var(--seed-font-size-t14);
  font-weight: var(--seed-font-weight-bold);
  line-height: 1.15; letter-spacing: -0.02em;
  margin-bottom: var(--seed-x5);
}
.hero h1 .accent { color: var(--seed-color-fg-brand); }
.hero p {
  font-size: var(--seed-font-size-t6);
  color: var(--seed-color-fg-neutral-muted);
  max-width: 560px; margin-bottom: var(--seed-x8);
}
.btn-row { display: flex; gap: var(--seed-x3); flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: var(--seed-x2);
  font-size: var(--seed-font-size-t5);
  font-weight: var(--seed-font-weight-medium);
  padding: var(--seed-x3) var(--seed-x6);
  border-radius: var(--seed-radius-r3);
  border: none; cursor: pointer;
  transition: background var(--seed-duration-d3), transform var(--seed-duration-d3);
}
.btn:active { transform: scale(var(--seed-scale-pressed)); }
.btn-brand { background: var(--seed-color-bg-brand-solid); color: #fff; }
.btn-brand:hover, .btn-brand:active { background: var(--seed-color-bg-brand-solid-pressed); }
.btn-neutral {
  background: var(--seed-color-bg-layer-fill);
  color: var(--seed-color-fg-neutral);
  border: 1px solid var(--seed-color-stroke-neutral-weak);
}
.btn-neutral:hover { background: var(--seed-color-bg-layer-basement); }

/* ---- Sections ---- */
section { padding: var(--seed-x16) 0; }
.section-title {
  font-size: var(--seed-font-size-t10);
  font-weight: var(--seed-font-weight-bold);
  margin-bottom: var(--seed-x2); letter-spacing: -0.01em;
}
.section-sub {
  font-size: var(--seed-font-size-t5);
  color: var(--seed-color-fg-neutral-subtle);
  margin-bottom: var(--seed-x10);
}

/* ---- About ---- */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--seed-x6); }
@media (max-width: 720px){ .about-grid { grid-template-columns: 1fr; } }
.about-card {
  background: var(--seed-color-bg-layer-fill);
  border: 1px solid var(--seed-color-stroke-neutral-muted);
  border-radius: var(--seed-radius-r4);
  padding: var(--seed-x6);
}
.about-card h3 {
  font-size: var(--seed-font-size-t6);
  font-weight: var(--seed-font-weight-bold);
  margin-bottom: var(--seed-x3);
}
.about-card p { color: var(--seed-color-fg-neutral-muted); font-size: var(--seed-font-size-t5); }

/* ---- Projects (SEED List/Card 패턴 참조) ---- */
.project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--seed-x5); }
@media (max-width: 860px){ .project-grid { grid-template-columns: 1fr; } }
.project-card {
  background: var(--seed-color-bg-layer-default);
  border: 1px solid var(--seed-color-stroke-neutral-weak);
  border-radius: var(--seed-radius-r4);
  overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--seed-shadow-s1);
  transition: box-shadow var(--seed-duration-d3), transform var(--seed-duration-d3);
}
.project-card:hover { box-shadow: var(--seed-shadow-s3); transform: translateY(-2px); }
.project-thumb {
  aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center;
  font-size: var(--seed-font-size-t13); font-weight: var(--seed-font-weight-bold);
  color: #fff;
}
.thumb-1 { background: linear-gradient(135deg, #f60, #ff9364); }
.thumb-2 { background: linear-gradient(135deg, #217cf9, #85b8fd); }
.thumb-3 { background: linear-gradient(135deg, #079171, #4dd4ac); }
.project-body { padding: var(--seed-x5); display: flex; flex-direction: column; gap: var(--seed-x2); }
.project-body h3 { font-size: var(--seed-font-size-t6); font-weight: var(--seed-font-weight-bold); }
.project-body p { font-size: var(--seed-font-size-t3); color: var(--seed-color-fg-neutral-muted); }
.chip-row { display: flex; gap: var(--seed-x2); flex-wrap: wrap; margin-top: var(--seed-x2); }
.chip {
  font-size: var(--seed-font-size-t2);
  font-weight: var(--seed-font-weight-medium);
  color: var(--seed-color-fg-neutral-muted);
  background: var(--seed-color-bg-layer-fill);
  border: 1px solid var(--seed-color-stroke-neutral-muted);
  padding: 2px var(--seed-x3);
  border-radius: var(--seed-radius-full);
}

/* ---- Skills ---- */
.skill-row { display: flex; gap: var(--seed-x3); flex-wrap: wrap; }
.skill {
  font-size: var(--seed-font-size-t3);
  font-weight: var(--seed-font-weight-medium);
  background: var(--seed-color-bg-brand-weak);
  color: var(--seed-color-fg-brand-contrast);
  padding: var(--seed-x2) var(--seed-x4);
  border-radius: var(--seed-radius-full);
  transition: background var(--seed-duration-d3);
}
.skill:hover { background: var(--seed-color-bg-brand-weak-pressed); }

/* ---- Contact / Footer ---- */
.contact-box {
  background: var(--seed-color-bg-neutral-inverted);
  color: var(--seed-color-fg-neutral-inverted);
  border-radius: var(--seed-radius-r6);
  padding: var(--seed-x16) var(--seed-x8);
  text-align: center;
}
.contact-box h2 {
  font-size: var(--seed-font-size-t10);
  font-weight: var(--seed-font-weight-bold);
  margin-bottom: var(--seed-x3);
}
.contact-box p { opacity: .75; margin-bottom: var(--seed-x6); font-size: var(--seed-font-size-t5); }
footer {
  padding: var(--seed-x10) 0;
  text-align: center;
  font-size: var(--seed-font-size-t2);
  color: var(--seed-color-fg-neutral-subtle);
  border-top: 1px solid var(--seed-color-stroke-neutral-muted);
  margin-top: var(--seed-x16);
}

/* ===== SEED 랜딩 구조 차용 섹션들 ===== */
.sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:var(--seed-x4); margin-bottom:var(--seed-x2); }
.more-link { font-size:var(--seed-font-size-t3); font-weight:var(--seed-font-weight-medium); color:var(--seed-color-fg-neutral-subtle); transition:color var(--seed-duration-d3); white-space:nowrap; }
.more-link:hover { color:var(--seed-color-fg-brand); }

/* 대표 프로젝트 — SEED '디자인 원칙' 구조: 좌측 고정 제목 + 우측 대형 카드 스택 */
.principle-grid { display:grid; grid-template-columns: 300px minmax(0,1fr); gap:var(--seed-x10); align-items:start; }
@media (max-width: 860px){ .principle-grid { grid-template-columns:1fr; } .principle-sticky { position:static; } }
.principle-sticky { position:sticky; top:calc(var(--seed-x14) + var(--seed-x8)); }
.principle-cards { display:flex; flex-direction:column; gap:var(--seed-x16); }
.principle-card .art {
  border-radius: var(--seed-radius-r6); aspect-ratio: 16/9; overflow: hidden;
  display:flex; align-items:center; justify-content:center; position:relative;
  transition: transform var(--seed-duration-d6);
}
.principle-card:hover .art { transform: scale(1.015); }
.principle-card h3 { font-size:var(--seed-font-size-t8); font-weight:var(--seed-font-weight-bold); margin:var(--seed-x5) 0 var(--seed-x2); }
.principle-card p { color:var(--seed-color-fg-neutral-muted); }
/* art 1: 연두 배경 + 슬라이딩 필 (SEED Accessible 카드 오마주) */
.art-pill { background:#d6f5a2; }
.art-pill .bar { display:flex; width:120%; height:22%; }
.art-pill .bar span { flex:1; }
.art-pill .bar span:nth-child(1){ background:#1a1c20; border-radius:999px 0 0 999px; }
.art-pill .bar span:nth-child(2){ background:#f60; }
.art-pill .bar span:nth-child(3){ background:#fff; border-radius:0 999px 999px 0; }
.art-pill .bar span:nth-child(4){ background:#00a05e; }
@keyframes slidePill { 0%,100%{ transform:translateX(-6%);} 50%{ transform:translateX(6%);} }
.art-pill .bar { animation: slidePill 6s ease-in-out infinite; }
/* art 2: 다크 배경 + 대각선 스트로크 */
.art-lines { background:#17191c; }
.art-lines svg { width:70%; height:70%; }
@keyframes drawLine { 0%{ stroke-dashoffset:220; } 55%,100%{ stroke-dashoffset:0; } }
.art-lines line { stroke-dasharray:220; animation: drawLine 5s ease-in-out infinite; }
/* art 3: 캐럿 배경 + 그리드 */
.art-grid { background:#f60; }
.art-grid svg { width:100%; height:100%; }
@keyframes gridFloat { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-6px);} }
.art-grid circle { animation: gridFloat 4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce){ .art-pill .bar, .art-lines line, .art-grid circle { animation:none; } }

/* 인사이트 — SEED '기반' 구조: 가로 스크롤 썸네일 행 */
.showcase-row {
  display:grid; grid-auto-flow:column; grid-auto-columns: 280px;
  gap:var(--seed-x5); overflow-x:auto; padding:var(--seed-x2) var(--seed-x1) var(--seed-x5);
  scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
}
.showcase-row::-webkit-scrollbar { height:8px; }
.showcase-row::-webkit-scrollbar-thumb { background:var(--seed-color-stroke-neutral-weak); border-radius:999px; }
.ins-card { scroll-snap-align:start; display:block; }
.ins-card .thumb {
  aspect-ratio:16/10; border-radius:var(--seed-radius-r4); overflow:hidden;
  border:1px solid var(--seed-color-stroke-neutral-muted);
}
.ins-card .thumb svg { width:100%; height:100%; display:block; transition:transform var(--seed-duration-d6); }
.ins-card:hover .thumb svg { transform:scale(1.06); }
.ins-card .label { font-size:var(--seed-font-size-t4); font-weight:var(--seed-font-weight-medium); margin-top:var(--seed-x3); }
.ins-card .cat { font-size:var(--seed-font-size-t2); color:var(--seed-color-fg-neutral-subtle); }
.ins-more { display:flex; align-items:center; justify-content:center; border:1px dashed var(--seed-color-stroke-neutral-weak); border-radius:var(--seed-radius-r4); aspect-ratio:16/10; color:var(--seed-color-fg-neutral-subtle); font-size:var(--seed-font-size-t4); font-weight:var(--seed-font-weight-medium); transition:all var(--seed-duration-d3); scroll-snap-align:start; }
.ins-more:hover { color:var(--seed-color-fg-brand); border-color:var(--seed-color-palette-carrot-300); background:var(--seed-color-bg-brand-weak); }

/* 에세이 — SEED '자라나는 과정' 구조: 3열 아티클 카드 */
.essay-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--seed-x6); }
@media (max-width: 860px){ .essay-grid { grid-template-columns:1fr; } }
.essay-card .thumb { aspect-ratio:16/10; border-radius:var(--seed-radius-r4); overflow:hidden; border:1px solid var(--seed-color-stroke-neutral-muted); }
.essay-card .thumb svg { width:100%; height:100%; display:block; transition:transform var(--seed-duration-d6); }
.essay-card:hover .thumb svg { transform:scale(1.05); }
.essay-card h3 { font-size:var(--seed-font-size-t6); font-weight:var(--seed-font-weight-bold); margin:var(--seed-x4) 0 var(--seed-x1); }
.essay-card p { font-size:var(--seed-font-size-t3); color:var(--seed-color-fg-neutral-subtle); }

/* 브랜드 피날레 — SEED 푸터 오마주 */

/* ===== SEED 랜딩 인트로 구조 (실측: 제목 52px/700 좌측 + 설명 16px 우측 + 풀블리드 거대 마크) ===== */
.intro-band {

}

/* ===== SEED 랜딩 연출 보정: 다크 캔버스 · 52px 타이포 · 와이드 · 필 내비 · 풀블리드 푸터 ===== */
body.landing { background: #121212; color: #fff; }
body.landing .container { max-width: 1400px; }
body.landing section { padding: calc(var(--seed-x16) * 1.4) 0; }

.mosaic > div { border-radius: var(--seed-radius-r4); aspect-ratio: 1/1; overflow: hidden; }

@media (max-width: 900px){ .mosaic { grid-template-columns: repeat(3, 1fr); } .mosaic > div:nth-child(n+7){ display:none; } }
/* 다크 캔버스 위 컴포넌트 보정 */
body.landing .intro-band { background: transparent; padding-top: var(--seed-x16); }

body.motion-off * { animation-play-state: paused !important; }

/* A. 1막 모자이크 타일 애니메이션 */
@keyframes tilePulse { 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
@keyframes tileSway  { 0%,100%{ transform:rotate(-4deg);} 50%{ transform:rotate(4deg);} }
@keyframes tileSpin  { 0%{ transform:rotate(0);} 100%{ transform:rotate(360deg);} }
@keyframes tileHop   { 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10%);} }
.mosaic .anim-pulse { animation: tilePulse 3.2s ease-in-out infinite; transform-origin:center; }
.mosaic .anim-sway  { animation: tileSway 3.8s ease-in-out infinite; transform-origin:50% 80%; }

@media (prefers-reduced-motion: reduce){ .mosaic svg *, .mosaic svg { animation:none !important; } }

.art-pill .bar { animation: none; will-change: transform; }
.art-lines line { animation: none; will-change: stroke-dashoffset; }
.art-grid circle { animation: none; will-change: transform; }

/* D. 기반 무한 마퀴 */
.marquee-viewport { position: relative; overflow: hidden; width: 100vw; margin-left: calc(50% - 50vw); padding: var(--seed-x2) 0 var(--seed-x5); }

@media (prefers-reduced-motion: reduce){ .marquee-viewport { overflow-x: auto; } }

/* h1 줄 리빌 (인트로 제목) */
.intro-band h1 .mask { display:block; overflow:hidden; }
.intro-band h1 .line { display:block; transform:translateY(110%); will-change:transform; }
@media (prefers-reduced-motion: reduce){ .intro-band h1 .line { transform:none; } }

/* 반응형 보정 — SEED 모바일 실측: 섹션 제목 28px */
body.landing .section-title { font-size: clamp(28px, 3.6vw, 52px); margin-bottom: var(--seed-x4); }

@media (max-width: 860px){
